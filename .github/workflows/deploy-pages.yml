name: Deploy dashboard to GitHub Pages

# Optional automatic deploy — the manual path (cd frontend && npm run
# deploy) still works and is documented in the README as the fallback.
#
# One-time setup this workflow needs that can't be done from a commit:
# repo Settings -> Actions -> General -> Workflow permissions -> set to
# "Read and write permissions". Without that, the push step below fails
# with a 403 even though everything else succeeds.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
